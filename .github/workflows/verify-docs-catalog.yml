name: Verify docs catalog

on:
  push:
    branches: [docs]
    paths:
      - 'document/**'
      - 'tools/docsify/**'
  pull_request:
    branches: [docs]
    paths:
      - 'document/**'
      - 'tools/docsify/**'

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild catalog
        run: node tools/docsify/build-catalog.mjs
      - name: Verify catalog
        run: node tools/docsify/verify-catalog.mjs
      - name: Commit generated index
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- catalog search; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog search
          git commit -m "chore: rebuild docs catalog"
          git push
